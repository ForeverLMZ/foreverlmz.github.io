<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mingze Li (Leukos)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560;9..144,620&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14151a;
    --fg: #edebe4;
    --fg-muted: #9799a6;
    --fg-faint: #63656f;
    --rule: #2a2c35;
    --accent: #4fb286;
    --font-display: "Fraunces", "Iowan Old Style", ui-serif, Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card { max-width: 26rem; text-align: center; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 560;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }
  .pen { font-family: var(--font-mono); font-size: 0.8rem; color: var(--fg-muted); margin: 0 0 1.6rem; }
  .pen em { color: var(--fg); font-style: italic; }
  p.msg {
    color: var(--fg-muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 1.8rem;
  }
  .links {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    padding-top: 1.4rem;
    border-top: 1px solid var(--rule);
  }
  a { color: var(--fg-muted); text-decoration: none; border-bottom: 1px solid var(--fg-faint); }
  a:hover { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Site under construction</p>
    <h1>Mingze Li</h1>
    <p class="pen">publishing as <em>Leukos</em></p>
    <p class="msg">
      This page is being rebuilt. In the meantime, feel free to reach out
      by email or take a look at my CV below.
    </p>
    <div class="links">
      <a href="mailto:mingze.li@nyu.edu">Email</a>
    </div>
  </div>
</body>
</html>
